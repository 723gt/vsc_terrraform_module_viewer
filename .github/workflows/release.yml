name: Release VSIX

# main へのマージ・push のたびに .vsix を作り、GitHub Release に添付する。
# Release のタグは package.json の version（例: v0.2.0）。
# - そのバージョンの Release がまだなければ新しく作る
# - すでにあれば、添付の .vsix を最新のビルドで置き換える
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing $VSIX"
            gh release upload "$TAG" "$VSIX" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$VSIX" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
